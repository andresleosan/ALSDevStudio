name: Capturas de proyectos

# Las capturas envejecen en cuanto se retoca un proyecto: la tarjeta muestra el estado
# antiguo hasta que carga el marco en vivo, y con la vista en vivo apagada o sin
# JavaScript no se actualiza nunca. Este job las rehace dos veces al día.
on:
  schedule:
    - cron: '0 5,17 * * *'   # 00:00 y 12:00 America/Bogota (UTC-5)
  workflow_dispatch:
    inputs:
      solo:
        description: 'Claves concretas separadas por coma (vacio = todas)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: capturas
  cancel-in-progress: false

jobs:
  regenerar:
    # Playwright 1.56 soporta Ubuntu 24.04; ubuntu-latest ya entrega 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: .github/capturas/package-lock.json

      - name: Instalar dependencias
        working-directory: .github/capturas
        run: npm ci

      - name: Instalar Chromium
        working-directory: .github/capturas
        run: npx playwright install --with-deps chromium

      - name: Regenerar capturas
        env:
          CAPTURAS_SOLO: ${{ inputs.solo }}
        run: |
          if [ -n "$CAPTURAS_SOLO" ]; then
            node .github/capturas/capturar.mjs --solo "$CAPTURAS_SOLO"
          else
            node .github/capturas/capturar.mjs
          fi

      - name: Validar sitio generado
        run: |
          node --test .github/cloudflare/build.test.mjs
          node .github/cloudflare/build.mjs

      - name: Commitear si algo cambio
        run: |
          if [ -z "$(git status --porcelain assets/projects)" ]; then
            echo "Ningun proyecto cambio de aspecto: no hay nada que commitear."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/projects
          git commit -m "chore: regenerar capturas de proyectos"
          git push
